<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- G Swoosh Gradient -->
    <linearGradient id="gSwooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#00A2FF" />
      <stop offset="85%" stop-color="#005BFF" />
      <stop offset="100%" stop-color="#003ACC" />
    </linearGradient>

    <!-- Globe Ocean Gradient -->
    <radialGradient id="globeOceanGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E6BFF" />
      <stop offset="40%" stop-color="#0D44C8" />
      <stop offset="85%" stop-color="#05267A" />
      <stop offset="100%" stop-color="#021445" />
    </radialGradient>

    <!-- Globe Atmosphere Glow -->
    <radialGradient id="atmoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="96%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8" />
    </radialGradient>

    <!-- Landmass Gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Plus Symbol Gradient -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EFA8A" />
      <stop offset="50%" stop-color="#10E270" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Sun Radial Gradient -->
    <radialGradient id="sunGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#021445" flood-opacity="0.35" />
    </filter>
    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Large "G" Crescent Outer Swoosh -->
  <path d="M 285 85 C 190 70 80 145 70 260 C 60 385 155 455 260 455 C 340 455 405 405 435 340 C 445 320 435 305 410 305 L 360 305 C 335 305 325 325 310 345 C 290 370 250 385 220 380 C 160 370 125 315 130 250 C 135 185 190 140 250 140 C 275 140 300 150 320 165 C 335 175 355 170 365 150 L 380 120 C 390 100 375 80 345 75 Z"
        fill="url(#gSwooshGrad)" filter="url(#softShadow)" />

  <!-- The Planet Earth Globe -->
  <g id="globeGroup" transform="translate(225, 325)">
    <!-- Ocean Sphere -->
    <circle cx="0" cy="0" r="115" fill="url(#globeOceanGrad)" filter="url(#softShadow)" />
    
    <!-- Atmosphere Ring Glow -->
    <circle cx="0" cy="0" r="115" fill="url(#atmoGlow)" />

    <!-- Lat/Long Coordinate Grid Lines -->
    <g stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.45">
      <!-- Latitude Lines -->
      <ellipse cx="0" cy="-60" rx="98" ry="24" />
      <ellipse cx="0" cy="-20" rx="113" ry="28" />
      <ellipse cx="0" cy="25" rx="112" ry="28" />
      <ellipse cx="0" cy="65" rx="95" ry="24" />
      <!-- Longitude Meridians -->
      <ellipse cx="-45" cy="0" rx="42" ry="115" />
      <ellipse cx="0" cy="0" rx="72" ry="115" />
      <ellipse cx="45" cy="0" rx="42" ry="115" />
      <line x1="-115" y1="0" x2="115" y2="0" />
      <line x1="0" y1="-115" x2="0" y2="115" />
    </g>

    <!-- Continents Shape (Vector stylized Africa/Eurasia/Islands) -->
    <g fill="url(#landGrad)">
      <!-- Eurasia / Asia Landmass -->
      <path d="M -65 -75 C -50 -85 -20 -95 15 -85 C 45 -75 75 -65 85 -40 C 95 -15 80 15 65 30 C 50 45 40 60 25 65 C 10 70 -10 50 -20 40 C -30 30 -45 45 -55 20 C -65 -5 -80 -15 -85 -40 C -90 -65 -80 -65 -65 -75 Z" />
      <!-- Indian subcontinent / SE Asia extension -->
      <path d="M -10 -25 C 5 -35 25 -30 20 -10 C 15 10 -5 35 -15 35 C -25 35 -25 0 -10 -25 Z" />
      <!-- Archipelago / Indonesia / Philippines -->
      <ellipse cx="42" cy="48" rx="12" ry="6" transform="rotate(-25 42 48)" />
      <ellipse cx="65" cy="42" rx="9" ry="5" transform="rotate(15 65 42)" />
      <ellipse cx="28" cy="58" rx="8" ry="4" />
      <!-- Japan / East archipelago -->
      <path d="M 72 -35 C 78 -25 80 -10 75 0 C 70 -10 70 -25 72 -35 Z" />
    </g>

    <!-- White Orbit Ring Sweeping Around Globe -->
    <ellipse cx="0" cy="5" rx="155" ry="42" stroke="#FFFFFF" stroke-width="4.5" fill="none" opacity="0.88" transform="rotate(-18)" />
    <path d="M -150 45 C -100 80 80 40 145 -10" stroke="#00E5FF" stroke-width="3" fill="none" opacity="0.9" />

    <!-- Red Location Pin Marker -->
    <g id="mapPin" transform="translate(0, -32)" filter="url(#pinShadow)">
      <path d="M 0 0 C -15 -20 -18 -32 -18 -42 C -18 -54 -9 -62 0 -62 C 9 -62 18 -54 18 -42 C 18 -32 15 -20 0 0 Z" fill="url(#pinGrad)" />
      <circle cx="0" cy="-42" r="7.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Green Plus "+" Symbol on Right -->
  <g id="plusSymbol" transform="translate(425, 290)" filter="url(#softShadow)">
    <rect x="-16" y="-52" width="32" height="104" rx="16" fill="url(#plusGrad)" />
    <rect x="-52" y="-16" width="104" height="32" rx="16" fill="url(#plusGrad)" />
  </g>

  <!-- Weather Cluster: Sun, Cloud, Rain, Wind -->
  <g id="weatherCluster" transform="translate(305, 155)" filter="url(#softShadow)">
    <!-- Sun Behind Cloud -->
    <g transform="translate(-35, -30)">
      <!-- Sun Rays -->
      <g stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round">
        <line x1="0" y1="-32" x2="0" y2="-44" />
        <line x1="23" y1="-23" x2="32" y2="-32" />
        <line x1="32" y1="0" x2="44" y2="0" />
        <line x1="23" y1="23" x2="32" y2="32" />
        <line x1="0" y1="32" x2="0" y2="44" />
        <line x1="-23" y1="23" x2="-32" y2="32" />
        <line x1="-32" y1="0" x2="-44" y2="0" />
        <line x1="-23" y1="-23" x2="-32" y2="-32" />
      </g>
      <!-- Sun Disk -->
      <circle cx="0" cy="0" r="26" fill="url(#sunGrad)" />
    </g>

    <!-- Cloud in Front -->
    <path d="M -45 15 C -45 0 -30 -12 -12 -12 C -8 -28 10 -38 28 -34 C 44 -30 55 -16 54 2 C 68 3 78 14 77 28 C 76 40 64 48 50 48 L -35 48 C -52 48 -60 35 -60 25 C -60 18 -54 14 -45 15 Z"
          fill="url(#cloudGrad)" />

    <!-- 3 Falling Raindrops -->
    <g fill="url(#rainGrad)">
      <path d="M -18 62 C -18 56 -13 52 -13 52 C -13 52 -8 56 -8 62 C -8 66 -10 69 -13 69 C -16 69 -18 66 -18 62 Z" />
      <path d="M 6 64 C 6 58 11 54 11 54 C 11 54 16 58 16 64 C 16 68 14 71 11 71 C 8 71 6 68 6 64 Z" />
      <path d="M 30 62 C 30 56 35 52 35 52 C 35 52 40 56 40 62 C 40 66 38 69 35 69 C 32 69 30 66 30 62 Z" />
    </g>

    <!-- Wind Stream / Air Flow Lines on the Right -->
    <g stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M 55 -5 C 75 -5 88 -5 96 -10 C 104 -15 102 -26 92 -26 C 85 -26 80 -21 82 -15" />
      <path d="M 62 14 C 82 14 100 14 110 10 C 120 5 118 -6 108 -6 C 100 -6 96 -1 98 4" />
      <path d="M 52 32 C 72 32 88 32 98 28" />
    </g>
  </g>
</svg>
